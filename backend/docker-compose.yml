services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: organizaeh
      POSTGRES_USER: appdecaixa
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-development-only}
    ports:
      - "5432:5432"
    volumes:
      - appdecaixa_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U appdecaixa -d organizaeh"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  appdecaixa_postgres:
